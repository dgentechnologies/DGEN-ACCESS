<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGEN Access Control System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid #00ff88;
        }

        h1 {
            font-size: 2.5em;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #00d4ff;
            font-size: 1.1em;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .panel h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #00ff88;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(10, 10, 30, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }

        .btn-danger {
            background: #ff0055;
            color: #fff;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #cc0044;
            transform: scale(1.05);
        }

        .btn-warning {
            background: #ffaa00;
            color: #000;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .btn-warning:hover {
            background: #ff8800;
            transform: scale(1.05);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 10, 30, 0.6);
        }

        th {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #000;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #333;
            color: #e0e0e0;
        }

        tr:hover {
            background: rgba(0, 255, 136, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #00ff88;
            color: #000;
        }

        .status-banned {
            background: #ff0055;
            color: #fff;
        }

        .status-granted {
            background: #00ff88;
            color: #000;
        }

        .status-denied {
            background: #ff0055;
            color: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
        }

        .alert-error {
            background: rgba(255, 0, 85, 0.2);
            border: 2px solid #ff0055;
            color: #ff0055;
        }

        .super-admin-badge {
            background: #ffaa00;
            color: #000;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            margin-left: 10px;
            font-weight: bold;
        }

        .full-width-panel {
            grid-column: 1 / -1;
        }

        .refresh-indicator {
            color: #00d4ff;
            font-size: 0.9em;
            text-align: right;
            margin-top: 10px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 DGEN TECHNOLOGIES</h1>
            <p class="subtitle">Access Control System Dashboard</p>
        </header>

        <div id="alertContainer"></div>

        <div class="grid">
            <!-- User Management Panel -->
            <div class="panel">
                <h2>👤 Add New Employee</h2>
                <form id="addUserForm">
                    <div class="form-group">
                        <label for="userName">Full Name</label>
                        <input type="text" id="userName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="userId">Employee ID (RFID)</label>
                        <input type="text" id="userId" placeholder="DGEN-XX-XX" required>
                    </div>
                    <div class="form-group">
                        <label for="userRole">Role/Department</label>
                        <input type="text" id="userRole" placeholder="Software Engineer" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Authorize User</button>
                </form>
            </div>

            <!-- Employee List -->
            <div class="panel">
                <h2>📋 Employee Directory</h2>
                <div class="table-container">
                    <table id="userTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>ID</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Live Access Logs -->
            <div class="panel full-width-panel">
                <h2>📊 Live Access Logs</h2>
                <div class="table-container">
                    <table id="logsTable">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Name</th>
                                <th>ID</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <!-- Logs will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div class="refresh-indicator">
                    <span class="pulse">●</span> Auto-refresh every 5 seconds
                </div>
            </div>
        </div>
    </div>

    <script>
        // HTML escape function to prevent XSS
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Alert functions
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.style.display = 'none';
                alert.remove();
            }, 5000);
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch('/get_users');
                const users = await response.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    const isSuperAdmin = user.is_super_admin || false;
                    
                    row.innerHTML = `
                        <td>
                            ${escapeHtml(user.name)}
                            ${isSuperAdmin ? '<span class="super-admin-badge">EXECUTIVE</span>' : ''}
                        </td>
                        <td>${escapeHtml(user.id)}</td>
                        <td>${escapeHtml(user.role)}</td>
                        <td>
                            <span class="status-badge status-${user.status.toLowerCase()}">
                                ${user.status}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-toggle-status" data-user-id="${escapeHtml(user.id)}">
                                    ${user.status === 'Active' ? 'Ban' : 'Unban'}
                                </button>
                                ${!isSuperAdmin ? 
                                    `<button class="btn btn-danger btn-delete-user" data-user-id="${escapeHtml(user.id)}">Delete</button>` 
                                    : '<span style="font-size: 0.8em; color: #ffaa00;">Protected</span>'}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Add user
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('userName').value;
            const id = document.getElementById('userId').value;
            const role = document.getElementById('userRole').value;

            try {
                const response = await fetch('/add_user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, id, role })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('✓ User added successfully!', 'success');
                    document.getElementById('addUserForm').reset();
                    loadUsers();
                } else {
                    showAlert('✗ ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('✗ Error adding user', 'error');
                console.error('Error:', error);
            }
        });

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            try {
                const response = await fetch('/delete_user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: userId })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('✓ User deleted successfully!', 'success');
                    loadUsers();
                } else {
                    showAlert('✗ ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('✗ Error deleting user', 'error');
                console.error('Error:', error);
            }
        }

        // Toggle status
        async function toggleStatus(userId) {
            try {
                const response = await fetch('/toggle_status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: userId })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('✓ Status updated successfully!', 'success');
                    loadUsers();
                } else {
                    showAlert('✗ ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('✗ Error updating status', 'error');
                console.error('Error:', error);
            }
        }

        // Load logs
        async function loadLogs() {
            try {
                const response = await fetch('/get_logs');
                const logs = await response.json();
                const tbody = document.getElementById('logsTableBody');
                tbody.innerHTML = '';

                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666;">No access logs yet</td></tr>';
                    return;
                }

                logs.forEach(log => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${escapeHtml(log.time)}</td>
                        <td>${escapeHtml(log.name)}</td>
                        <td>${escapeHtml(log.id)}</td>
                        <td>
                            <span class="status-badge status-${log.status.toLowerCase()}">
                                ${escapeHtml(log.status)}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        // Event delegation for dynamically created buttons
        document.addEventListener('click', (e) => {
            // Handle toggle status button clicks
            if (e.target.classList.contains('btn-toggle-status')) {
                const userId = e.target.getAttribute('data-user-id');
                if (userId) {
                    toggleStatus(userId);
                }
            }
            
            // Handle delete button clicks
            if (e.target.classList.contains('btn-delete-user')) {
                const userId = e.target.getAttribute('data-user-id');
                if (userId) {
                    deleteUser(userId);
                }
            }
        });

        // Initialize and set up auto-refresh
        window.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            loadLogs();

            // Auto-refresh logs every 5 seconds
            setInterval(loadLogs, 5000);
        });
    </script>
</body>
</html>
